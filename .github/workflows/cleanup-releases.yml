name: Cleanup old releases

on:
  push:
    branches:
      - 'tmp/release-cleanup'
    paths:
      - '.github/workflows/cleanup-releases.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this temporary workflow still exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/contents/.github/workflows/cleanup-releases.yml?ref=tmp/release-cleanup" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete every release except the latest
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          echo "Keep: $latest"
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name != \"$latest\") | .tag_name" > old_tags.txt
          count=0
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Delete release: $tag"
            gh release delete "$tag" --repo "$GH_REPO" --yes
            count=$((count + 1))
          done < old_tags.txt
          echo "Deleted $count release(s)."
