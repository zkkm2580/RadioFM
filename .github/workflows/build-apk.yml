name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.2.3-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk "release_dist/FM网络收音机.apk"
        cp app/build/outputs/apk/debug/*.apk "release_dist/RadioFM-Latest.apk"

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FM网络收音机-Debug-APK
        path: release_dist/FM网络收音机.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: FM网络收音机 v1.2.3 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### FM网络收音机 (RadioFM) 更新说明

          > 修复版：修复首个频道能播、切到第 2/3 台起卡在「已暂停」的问题。根因是切台时每次都新建 AudioFocusRequest 并重复申请音频焦点，旧 listener 收到 AUDIOFOCUS_LOSS 触发 pausePlayback()，与新 listener 的 GAIN 回调互相打架，把正在切台的新流暂停。现改为复用同一焦点请求与监听器、已持有焦点则不重复申请。versionCode 为 8，可直接覆盖安装。

          > v1.2.2 基线：基于反编译官方 VLC 客户端的一手结论整合，播放链路保持 v1.2.1（信任 libvlc demux probe、不强制格式），libvlc-all 升级到 3.7.1（内核 3.0.22-rc1 → 3.0.23 正式版，与官方同款），并修正 :codec=all 注释。

          - 播放内核统一为 VideoLAN LibVLC，所有电台流一律由 VLC 播放：
            - 不再按格式分流引擎：网络电台、HLS (.m3u8)、AAC/MP3、Tvheadend MPEG-TS 全部交由 LibVLC 解码；
            - 默认不向 LibVLC 声明容器格式：解封装由 libvlc 自带的 demux probe 现场判定，与 VLC 官方客户端机制一致；
            - 硬解开关交给 Media.setHWDecoderEnabled()（官方源码：开硬解 :codec=<Mediacodec模块>,all，关硬解 :codec=all，all 为有效伪模块名）；
            - 内核升级至 libvlc-all 3.7.1（LibVLC 3.0.23 正式版，与官方 VLC 客户端同款）；
            - 三级容灾：自动探测失败 → 强制 :demux=ts 重试 → 强制 TS + 转软解 → 延时回到自动探测；
            - 网络缓冲 1500ms；UA 对齐官方式样 VLC/3.0.23 LibVLC/3.0.23；
            - Media3 仅保留 MediaSession 的 Player 载体作用，不参与解码。

          - 全面支持汽车方向盘换台与车载中控控制：
            - 深度集成经典与现代 Android MediaSession 车载媒体会话协议；
            - 注册全局 MediaButtonReceiver 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus）；
            - 通知栏升级为标准车载媒体控制样式。

          - 实时时钟与机车 5 秒高频准确定位天气：
            - 播放界面时钟下方新增县市与实时天气一栏；
            - 5 秒高频双轨动态刷新，跨区位移即时更新；
            - 优先车载 GPS，无信号回退网络基站与 IP，内置无 GMS 逆地理引擎。

          - 深色/夜间模式自动跟随系统：
            - 新增 DayNight 双套色彩与主题系统。
        files: |
          release_dist/FM网络收音机.apk
          release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
