name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.2.2-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        # 同时保留中文名与 URL 安全名称，确保任意浏览器下载均不乱码
        cp app/build/outputs/apk/debug/*.apk "release_dist/FM网络收音机.apk"
        cp app/build/outputs/apk/debug/*.apk "release_dist/RadioFM-Latest.apk"

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FM网络收音机-Debug-APK
        path: release_dist/FM网络收音机.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: FM网络收音机 v1.2.2 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### FM网络收音机 (RadioFM) 更新说明

          > ℹ️ 本版本基于反编译官方 VLC 客户端的一手结论整合：播放链路保持 v1.2.1 不变（信任 libvlc demux probe、不强制格式），仅将 libvlc-all 从 3.6.5 升级到 3.7.1（内核 3.0.22-rc1 → 3.0.23 正式版，与官方同款），并修正 `:codec=all` 注释。versionCode 为 7，可直接覆盖安装。

          - 📻 **播放内核统一为 VideoLAN LibVLC，所有电台流一律由 VLC 播放**：
            - 不再按格式分流引擎：网络电台、HLS (`.m3u8`)、AAC/MP3、Tvheadend MPEG-TS 全部交由 LibVLC 解码，避免换源换引擎导致的“有的台能响、有的台不响”；
            - 默认不向 LibVLC 声明容器格式：解封装由 libvlc 自带的 demux probe 现场判定（TS 校验 0x47 同步字节与 188 字节包对齐，HLS 校验 `#EXTM3U` / `application/vnd.apple.mpegurl`），与 VLC 官方客户端机制一致，不再按 URL 猜格式；
            - 硬解开关交给 `Media.setHWDecoderEnabled()`（官方源码：开硬解 `:codec=<Mediacodec模块>,all`，关硬解 `:codec=all`，`all` 为有效伪模块名）；
            - 内核升级至 libvlc-all 3.7.1（LibVLC 3.0.23 正式版，与官方 VLC 客户端同款，修复 3.0.22-rc1 候选版缺陷）；
            - 三级容灾：自动探测失败 → 强制 `:demux=ts` 重试 → 强制 TS 并转 libavcodec 软解 → 延时回到自动探测；TS 专用参数只在兜底轮次出现；
            - 网络缓冲收敛到 1500ms，避免直播流延迟持续堆积；UA 对齐官方式样 `VLC/3.0.23 LibVLC/3.0.23`；
            - Media3 仅保留 `MediaSession` 车载会话所需的 Player 载体作用，不参与解码，同时移除 media3-exoplayer-hls / rtsp / ui 等冗余依赖；
            - **优化屏显状态实时联动**：精准监听 LibVLC 播放事件与解码推进（TimeChanged），不再出现卡在“正在缓冲”的假状态。

          - 🚗 **全面支持汽车方向盘换台与车载中控控制**：
            - 深度集成经典与现代 Android `MediaSession` 车载媒体会话协议；
            - 注册全局 `MediaButtonReceiver` 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus），方向盘上一曲/下一曲按键 100% 响应；
            - 通知栏升级为标准车载媒体控制样式（支持上一台/暂停/下一台）。

          - 📍 **实时时钟与机车 5 秒高频准确定位天气**：
            - 播放界面时钟下方新增县市与实时天气一栏，字体大小与标题对齐（20sp）；
            - 采用 5 秒高频双轨动态刷新，机车行驶中实时捕获轨迹与跨区位移变化，即时更新当前县市；
            - 优先车载 GPS 硬件定位，无信号时平滑回退网络基站与 IP 兜底，内置车机无 GMS 专用逆地理引擎。

          - 🌙 **深色/夜间模式自动跟随系统**：
            - 新增 DayNight 双套色彩与主题系统，汽车开大灯/夜间时界面自动切换为深色护眼模式。
        files: |
          release_dist/FM网络收音机.apk
          release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
