name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: |
        gradle assembleDebug --stacktrace > build.log 2>&1 || BUILD_FAILED=1
        if [ "$BUILD_FAILED" = "1" ]; then
          echo "=== BUILD FAILED ==="
          tail -n 250 build.log > build_error.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B debug-log
          git add -f build_error.txt
          git commit -m "chore: save build failure log" || true
          git push origin debug-log --force || true
          exit 1
        fi

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.2.1-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk release_dist/RadioFM-Latest.apk
        ls -la release_dist/

    - name: 上传编译日志（排查用）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log
        retention-days: 1

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 畅听FM-Debug-APK
        path: release_dist/RadioFM-Latest.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: 畅听FM v1.2.1 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### 畅听FM (RadioFM) v1.2.1 更新说明
          
          - 🚗 **全面支持汽车方向盘换台与车载中控控制**：
            - 深度集成经典与现代 Android `MediaSession` 车载媒体会话协议；
            - 注册全局 `MediaButtonReceiver` 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus），方向盘上一曲/下一曲按键 100% 响应；
            - 通知栏升级为标准车载媒体控制样式（支持上一台/暂停/下一台）。
          
          - ⚡ **极致轻量化精简（体积减少 90%，从 90MB 降至 ~8MB）**：
            - 彻底移除庞大的底层第三方 SO 动态库依赖，回归 Google 官方高能效 Media3 / ExoPlayer 纯净架构；
            - 启动速度更快，内存占用极低，运行流畅稳定。
          
          - 📻 **全套标准电台流媒体播放**：
            - 完美支持 HTTP/HTTPS 音频直播流、AAC、MP3 及 HLS (.m3u8) 广播流；
            - 默认源维持为 `http://zj.537224.xyz/radio.txt`。
          
          - 🌙 **深色/夜间模式自动跟随系统**：
            - 新增 DayNight 双套色彩与主题系统，汽车开大灯/夜间时界面自动切换为深色护眼模式。
        files: release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
