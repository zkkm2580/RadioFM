name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: |
        gradle assembleDebug --stacktrace --info 2>&1 | tee build.log || {
          echo "## Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          exit 1
        }

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.1.0-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk release_dist/RadioFM-Latest.apk

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 畅听FM-Debug-APK
        path: release_dist/RadioFM-Latest.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: 畅听FM v1.1.0 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### 畅听FM (RadioFM) 更新说明
          
          - 🚗 **全面支持汽车方向盘换台与车载中控控制**：
            - 深度集成经典与现代 Android `MediaSession` 车载媒体会话协议；
            - 注册全局 `MediaButtonReceiver` 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus），方向盘上一曲/下一曲按键 100% 响应；
            - 通知栏升级为标准车载媒体控制样式（支持上一台/暂停/下一台）。
          
          - 📻 **Tvheadend MPEG-TS 广播流播放增强**：
            - 针对 Tvheadend 特征直播流（8168 端口、/stream/、audio/mp2t）定制 VLC 原生 User-Agent 请求头与 Stagefright/ExoPlayer TS 解封装通道；
            - 自动双引擎故障转移与重连机制，保障 Tvheadend MP2 纯音频流正常播放；
            - 完美支持喜马拉雅 HLS m3u8 及各类私有端口网络广播流。
          
          - 🌙 **深色/夜间模式自动跟随系统**：
            - 新增 DayNight 双套色彩与主题系统，汽车开大灯/夜间时界面自动切换为深色护眼模式。
        files: release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
