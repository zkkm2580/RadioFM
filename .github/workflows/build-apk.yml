name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: |
        gradle assembleDebug --stacktrace > build.log 2>&1 || BUILD_FAILED=1
        if [ "$BUILD_FAILED" = "1" ]; then
          echo "## Gradle Error Summary" >> $GITHUB_STEP_SUMMARY
          echo "```text" >> $GITHUB_STEP_SUMMARY
          grep -E "error:|FAILURE:|FAILED|e: " build.log -A 4 -B 1 | head -n 80 >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "### Last 60 lines" >> $GITHUB_STEP_SUMMARY
          echo "```text" >> $GITHUB_STEP_SUMMARY
          tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          cat build.log | tail -n 80
          exit 1
        fi

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.2.0-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        cp app/build/outputs/apk/debug/*.apk release_dist/RadioFM-Latest.apk
        ls -la release_dist/

    - name: 上传编译日志（排查用）
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-build-log
        path: build.log
        retention-days: 1
    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 畅听FM-Debug-APK
        path: release_dist/RadioFM-Latest.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: 畅听FM v1.2.0 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### 畅听FM (RadioFM) v1.2.0 更新说明
          
          - 🚗 **全面支持汽车方向盘换台与车载中控控制**：
            - 深度集成经典与现代 Android `MediaSession` 车载媒体会话协议；
            - 注册全局 `MediaButtonReceiver` 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus），方向盘上一曲/下一曲按键 100% 响应；
            - 通知栏升级为标准车载媒体控制样式（支持上一台/暂停/下一台）。
          
          - 📻 **全面集成官方 LibVLC 3.6.2 原生软解内核**：
            - 内置完整编译的 FFmpeg (libavcodec) 软解引擎，彻底解决各类车机硬件芯片缺失 MP2 解码器的问题；
            - 完美播放 Tvheadend MPEG-TS (`audio/mp2t`, `stream/channelid`) 广播直播流；
            - 结合 Audio Master Clock 与 1500ms 车载网络抗抖动缓存，保证流媒体秒开且行驶中不卡顿；
            - 支持 HLS (m3u8) 与各类普通 HTTP 网络电台流。
          
          - 🌙 **深色/夜间模式自动跟随系统**：
            - 新增 DayNight 双套色彩与主题系统，汽车开大灯/夜间时界面自动切换为深色护眼模式。
        files: release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
