name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 配置 Gradle 环境
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 编译 Debug APK
      run: gradle assembleDebug --stacktrace

    - name: 整理发布 APK 文件
      id: release_apk
      run: |
        TAG_NAME="v1.1.0-$(date +'%Y%m%d%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        mkdir -p release_dist
        # 同时保留中文名与 URL 安全名称，确保任意浏览器下载均不乱码
        cp app/build/outputs/apk/debug/*.apk "release_dist/FM网络收音机.apk"
        cp app/build/outputs/apk/debug/*.apk "release_dist/RadioFM-Latest.apk"

    - name: 上传 APK 安装包至 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FM网络收音机-Debug-APK
        path: release_dist/FM网络收音机.apk
        retention-days: 7

    - name: 发布 APK 到 GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_apk.outputs.tag_name }}
        name: FM网络收音机 v1.1.0 (${{ steps.release_apk.outputs.tag_name }})
        body: |
          ### FM网络收音机 (RadioFM) 更新说明
          
          - 🚗 **全面支持汽车方向盘换台与车载中控控制**：
            - 深度集成经典与现代 Android `MediaSession` 车载媒体会话协议；
            - 注册全局 `MediaButtonReceiver` 与车载专用切歌广播监听；
            - 自动请求与维护音频焦点（AudioFocus），方向盘上一曲/下一曲按键 100% 响应；
            - 通知栏升级为标准车载媒体控制样式（支持上一台/暂停/下一台）。
          
          - 📍 **实时时钟与机车 5 秒高频准确定位天气**：
            - 播放界面时钟下方新增县市与实时天气一栏，字体大小与标题对齐（20sp）；
            - 采用 5 秒高频双轨动态刷新，机车行驶中实时捕获轨迹与跨区位移变化，即时更新当前县市；
            - 优先车载 GPS 硬件定位，无信号时平滑回退网络基站与 IP 兜底，内置车机无 GMS 专用逆地理引擎。
          
          - 🌙 **深色/夜间模式自动跟随系统**：
            - 新增 DayNight 双套色彩与主题系统，汽车开大灯/夜间时界面自动切换为深色护眼模式。
        files: |
          release_dist/FM网络收音机.apk
          release_dist/RadioFM-Latest.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
